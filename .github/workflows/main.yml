name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Linter
        run: npm run lint
        continue-on-error: false

      - name: Run Typecheck
        run: npx tsc --noEmit
        continue-on-error: false

      - name: Build Backend
        run: npm run build

      - name: Upload Build Artifacts (On Failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs
          path: ~/.npm/_logs

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint
        continue-on-error: false

      - name: Run Typecheck
        run: npx tsc --noEmit
        continue-on-error: false

      - name: Build Frontend
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Upload Build Artifacts (On Failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-logs
          path: ~/.npm/_logs
